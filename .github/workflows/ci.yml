name: Tests and Docker
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.simulation.yaml config --quiet
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: qundis-tester:ci
      - name: Run simulated receiver in Docker
        run: |
          docker run -d --name qundis-smoke -p 127.0.0.1:8766:8080 qundis-tester:ci python -m tester --simulate --host 0.0.0.0 --data /data
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8766/api/state', timeout=2) as response:
                      state = json.load(response)
                  assert state['status']['state'] == 'simulation'
                  assert len(state['meters']) >= 2
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
          docker stop -t 15 qundis-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' qundis-smoke)" = 0
      - name: Container logs
        if: always()
        run: docker logs qundis-smoke || true
