services:
  tester:
    build: .
    image: qundis-tester:local
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8766}:8080"
    volumes:
      - ./data-simulation:/data
    command: ["python", "-m", "tester", "--simulate", "--host", "0.0.0.0", "--data", "/data"]
    stop_grace_period: 15s
